    <h1>Wonton Soup</h1>
    <image src="https://www.cilantroandcitronella.com/wp-content/uploads/2021/05/vegan-wonton-soup-735x1103.jpg"></image>
    <h2>Easy Wonton Soup</h2>
    <p>Add some thin noodles to bulk it up.</p>
    <h3>Ingredients</h3>
    <ul>
        <li>Gyoza</li>
        <li>Mizo Soup Broth</li>
        <li>Bok Choy</li>
        <li>Sliced Shitake Mushrooms</li>
    </ul>
    <h3>Steps</h3>
    <ol>
        <li>Cook the mushrooms and bok choy on pan until wilted</li>
        <li>Add Miso Broth and Bring to boil</li>
        <li>Add Gyoza and simmer for 6 mins</li>
    </ol>
